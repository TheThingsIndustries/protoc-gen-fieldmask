syntax = "proto3";

package foo;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/TheThingsIndustries/protoc-gen-fieldmask/testdata/foo";

message Foo {
  string id = 1;
  int32 a = 2;

  message FooNested {
    string id = 1;
    int32 b = 2;

    map<string, FooNestedNested> mappings = 3;

    message FooNestedNested {
      string id = 1;
      int32 c = 2;

      bytes data = 3;
    }

    FooNestedNested nested_nested = 4;
  }

  oneof foo_oneof {
      string d = 3;
      int32 e = 4;
      uint32 f = 5;
  }

  FooNested nested = 6;
  google.protobuf.Duration duration = 7;
  google.protobuf.Timestamp created_at = 8;

  repeated Bar bars = 9;
}

message Bar {
  string id = 1;
  int32 g = 2;
  google.protobuf.Timestamp created_at = 3;
}
